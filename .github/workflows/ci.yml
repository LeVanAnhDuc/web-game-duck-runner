name: CI

# Chay tren moi pull request. Khong co no thi mot nhanh co the duoc gop vao khi
# dang do, va thu dau tien phat hien ra se la job deploy tren `main` — sau khi gop.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# App nam trong client/; moi buoc `run:` chay tu do.
defaults:
  run:
    working-directory: client

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phai dung TRUOC setup-node: `cache: pnpm` can binary pnpm da co san de
      # doc duong dan store. Khong khai bao `version:` — no lay tu truong
      # `packageManager` trong client/package.json, nen CI va may deu chay dung mot ban.
      - uses: pnpm/action-setup@v4
        with:
          # Khong co package.json o goc: app nam trong client/.
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # `--frozen-lockfile` chu khong `pnpm install` tran: lockfile la cau tra
      # loi, va workspace nay da tung bi mot cay dependency khac lam hong (xem
      # CLAUDE.md cua workspace).
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm test

      # `pnpm build` la `tsc --noEmit && vite build`, nen buoc nay bao luon typecheck.
      - run: pnpm build

      # Chuong nay bao ve bien gioi cua ADR-0002: `src/game/` khong duoc phu thuoc
      # Three.js, DOM, hay dong ho thuc. ESLint da chan bang `no-restricted-imports`,
      # nhung mot dong `import * as THREE from "three"` viet trong mot file moi ma
      # chua kip vao cau hinh thi se lot. Grep o day la lop thu hai, va no re.
      - name: Bien gioi mo phong / hien thi — ADR-0002
        run: |
          if grep -rn "from 'three'\|from \"three\"" src/game src/data; then
            echo "::error::src/game hoac src/data dang import Three.js — vi pham ADR-0002"
            exit 1
          fi
          echo "src/game va src/data khong phu thuoc Three.js: dung"

      - name: Kich thuoc bundle so voi NFR-PERF-09
        run: |
          # Nguong nam o docs/02-requirements/nfr.md: 250 KB gzip. In ra chu khong
          # chan cung — so do hien tai la 180.8 KB, nen mot cong cung chi bao dong
          # dung luc co sai sot ma log nay da chi ra roi.
          echo "kich thuoc gzip cua cac file da build:"
          for f in dist/assets/*.js dist/assets/*.css; do
            [ -f "$f" ] || continue
            printf '  %-40s %s\n' "$(basename "$f")" "$(gzip -c "$f" | wc -c | awk '{printf "%.1f kB", $1/1024}')"
          done

  # Job RIENG. Playwright phai tai Chromium (~1-2 phut); nhet no vao `verify` se
  # day thoi gian toi phan hoi dau tien len gap may lan cho moi pull request.
  #
  # Bo hoi quy la package rieng (`automation-testing/`). No tu build `client/` hai
  # lan (co dang nhap tat, va bat voi issuer gia) qua `webServer` roi phuc vu bang
  # `vite preview` — nen job chi can cai dependency cua ca hai package. No bat loai
  # loi ma `pnpm test` cua client khong the: man hinh that, phim va cu chi vuot that,
  # save that trong localStorage, ban build production that.
  e2e:
    name: Regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Khong co package.json o goc: app nam trong client/.
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            automation-testing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Install the regression suite
        working-directory: automation-testing
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: automation-testing
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck, unit, traceability
        working-directory: automation-testing
        run: pnpm typecheck && pnpm test:unit && pnpm coverage:check

      - name: Regression suite
        working-directory: automation-testing
        run: pnpm test

      - name: Bao cao Playwright khi e2e do
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            automation-testing/playwright-report/
            automation-testing/test-results/
          retention-days: 7

  # Mot job RIENG, de audit chay CANH cac test thay vi dung truoc chung. `pnpm audit`
  # doc client/pnpm-lock.yaml roi hoi registry — no khong can node_modules, nen job nay
  # bo qua buoc cai dat hoan toan. (Van can pnpm/action-setup@v4 de CO lenh pnpm.)
  #
  # NFR-SEC-05 chi dinh CI la noi kiem nguong nay; day la cho do.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Co thu lai, va registry khong voi tra duoc thi KHONG tinh la that bai. Mot
      # su co ben ngoai khong duoc bien mot cong bao mat thanh mot cai chan gop
      # ngau nhien. Mot canh bao that thi van lam do job.
      - name: pnpm audit (high tro len)
        run: |
          for attempt in 1 2 3; do
            out=$(pnpm audit --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            code=$?
            if echo "$out" | grep -qiE 'audit endpoint returned an error|The registry .* returned|Service Unavailable|ENOTFOUND|ETIMEDOUT|ECONNRESET'; then
              echo "::warning::lan thu $attempt khong voi duoc registry"
              sleep $((attempt * 15))
              continue
            fi
            echo "$out"
            exit $code
          done
          echo "::warning::pnpm audit khong voi duoc registry sau 3 lan; khong lam do build vi su co cua ben khac"
