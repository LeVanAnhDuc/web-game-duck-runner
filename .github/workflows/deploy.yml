name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phai dung TRUOC setup-node, va khong khai bao `version:` — ban pnpm lay
      # tu truong `packageManager` trong package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # `vite.config.ts` doc `base` tu VITE_BASE_PATH, khong co gia tri mac dinh trong code:
      # tren Pages game nam duoi /<ten-repo>/, nen build deploy phai dat no.
      # Ducker ID sign-in is shipped dark: the flag and DUCKER_* vars are deliberately
      # not passed (ADR-0012).
      - run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # `enablement` KHONG thay cho viec bat Pages mot lan cho repo. GITHUB_TOKEN
      # khong tao duoc Pages site. Giu lai vi no khong ton gi va giup mot fork ma
      # chu no da bat Pages san. Buoc bat mot lan nam o README §Releases and versioning.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
